<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGR Automation Dashboard</title>
    <style>
        :root {
            --bg-main: #1b1e2e;
            --bg-sidebar: #222536;
            --bg-header: #2a2e45;
            --text-main: #e0e6ed;
            --accent-green: #00bf88;
            --accent-blue: #3a86ff;
            --accent-red: #ff4d4d;
            --border: #333850;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.25rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .test-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .test-item {
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .test-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--border);
            transform: translateX(4px);
        }

        .test-item input[type="checkbox"] {
            margin-right: 14px;
            accent-color: var(--accent-green);
            transform: scale(1.2);
            cursor: pointer;
        }

        .test-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Main View */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            padding: 16px 32px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 5;
        }

        .url-box {
            display: flex;
            align-items: center;
            background: #111422;
            border-radius: 6px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            flex: 1;
            max-width: 500px;
        }

        .url-box label {
            font-size: 0.75rem;
            color: #888;
            margin-right: 10px;
            text-transform: uppercase;
        }

        .url-box input {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-family: monospace;
            width: 100%;
            outline: none;
        }

        .run-controls {
            display: flex;
            gap: 12px;
        }

        button.run-btn {
            background: linear-gradient(135deg, #00bf88 0%, #00a374 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0, 191, 136, 0.2);
        }

        button.run-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0, 191, 136, 0.3);
        }

        button.run-btn:disabled {
            background: #444;
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Workspace Area */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 450px;
            overflow: hidden;
        }

        .preview {
            background-color: #0f111a;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .preview-header {
            padding: 8px 16px;
            background: #161821;
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
        }

        .console-log {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #d1d5db;
        }

        /* Command Log (Cypress Style) */
        .command-log {
            background-color: #161821;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-header {
            padding: 12px 20px;
            background: #1c1e29;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .log-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .log-entry {
            display: flex;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 0.8rem;
        }

        .log-entry.command {
            background: rgba(58, 134, 255, 0.05);
            border-left: 3px solid var(--accent-blue);
        }

        .log-entry.success {
            border-left: 3px solid var(--accent-green);
            color: var(--accent-green);
        }

        .log-entry.error {
            border-left: 3px solid var(--accent-red);
            color: var(--accent-red);
        }

        .log-type {
            min-width: 60px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.7rem;
            opacity: 0.6;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        .tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #333;
            color: #aaa;
        }

        .select-all-btn {
            background: none;
            border: 1px solid var(--border);
            color: #888;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-all-btn:hover {
            color: #fff;
            border-color: #666;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1><span>⚙️</span> MGR Automation</h1>
            <div class="sidebar-actions">
                <span class="tag" id="testCount">0 Specs</span>
                <button class="select-all-btn" onclick="toggleSelectAll()">Select All</button>
            </div>
        </div>
        <div class="test-list" id="testList">
            <!-- Tests injected here -->
        </div>
    </aside>

    <main class="main">
        <header class="top-bar">
            <div class="url-box">
                <label>Environment</label>
                <input type="text" id="targetUrl" value="https://mgr-uat.dv.vai247.pro/">
            </div>
            <div class="run-controls">
                <button class="run-btn" id="runBtn" onclick="runTests()">
                    <span id="runBtnIcon">▶</span> 
                    <span id="runBtnText">Run Selected</span>
                </button>
            </div>
        </header>

        <section class="workspace">
            <div class="preview">
                <div class="preview-header">Execution Console</div>
                <div class="console-log" id="consoleOutput">
                    Select one or more test specifications to start execution.
                </div>
            </div>
            
            <div class="command-log">
                <div class="log-header">
                    <span>Command Log</span>
                    <span id="statusStats" style="font-size: 0.75rem; color: #888;">0 Passed · 0 Failed</span>
                </div>
                <div class="log-items" id="commandLog">
                    <!-- Logs injected here -->
                </div>
            </div>
        </section>
    </main>

    <script>
        let allSelected = false;

        async function loadTests() {
            const response = await fetch('/api/tests');
            const tests = await response.json();
            const list = document.getElementById('testList');
            document.getElementById('testCount').textContent = `${tests.length} Specs`;
            list.innerHTML = '';
            
            tests.forEach(test => {
                const div = document.createElement('div');
                div.className = 'test-item';
                div.innerHTML = `
                    <input type="checkbox" name="testfile" value="${test}" onclick="event.stopPropagation()">
                    <div class="test-name">${test}</div>
                `;
                div.onclick = () => {
                    const cb = div.querySelector('input');
                    cb.checked = !cb.checked;
                };
                list.appendChild(div);
            });
        }

        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('input[name="testfile"]');
            allSelected = !allSelected;
            checkboxes.forEach(cb => cb.checked = allSelected);
            document.querySelector('.select-all-btn').textContent = allSelected ? 'Deselect All' : 'Select All';
        }

        function addLog(type, message, status = '') {
            const logItems = document.getElementById('commandLog');
            const div = document.createElement('div');
            div.className = `log-entry ${status || 'command'}`;
            div.innerHTML = `
                <div class="log-type">${type}</div>
                <div class="log-msg">${message}</div>
            `;
            logItems.appendChild(div);
            logItems.scrollTop = logItems.scrollHeight;
        }

        async function runTests() {
            const checkboxes = document.querySelectorAll('input[name="testfile"]:checked');
            const selectedFiles = Array.from(checkboxes).map(cb => cb.value);

            if (selectedFiles.length === 0) {
                alert("Select at least one spec to run.");
                return;
            }

            const runBtn = document.getElementById('runBtn');
            const runBtnIcon = document.getElementById('runBtnIcon');
            const runBtnText = document.getElementById('runBtnText');
            const consoleDiv = document.getElementById('consoleOutput');
            const commandLog = document.getElementById('commandLog');
            
            runBtn.disabled = true;
            runBtnIcon.textContent = '⏳';
            runBtnText.textContent = 'Running...';
            consoleDiv.textContent = "";
            commandLog.innerHTML = "";
            
            const url = document.getElementById('targetUrl').value;
            addLog('SYSTEM', `Initializing execution against ${url}`, 'success');

            try {
                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ test_files: selectedFiles, url: url })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const text = decoder.decode(value);
                    
                    const lines = text.split('\n');
                    lines.forEach(line => {
                        if (!line.trim()) return;
                        
                        if (line.includes('▶️ Running')) {
                            const match = line.match(/▶️ Running (.*)\.\.\./);
                            if (match) addLog('RUN', match[1], 'success');
                        } else if (line.includes('PASSED')) {
                             addLog('ASSERT', 'Test Passed', 'success');
                        } else if (line.includes('FAILED')) {
                             addLog('ASSERT', 'Test Failed', 'error');
                        } else if (line.includes('[LOG] Clicked:')) {
                             const match = line.match(/Clicked: (.*)/);
                             addLog('CLICK', match ? match[1] : 'element');
                        } else if (line.includes('[LOG] Typed')) {
                             const match = line.match(/Typed and verified (.*):/);
                             addLog('TYPE', match ? match[1] : 'text');
                        }
                    });

                    consoleDiv.textContent += text;
                    consoleDiv.scrollTop = consoleDiv.scrollHeight;
                }
            } catch (err) {
                addLog('ERROR', err.message, 'error');
            } finally {
                runBtn.disabled = false;
                runBtnIcon.textContent = '▶';
                runBtnText.textContent = 'Run Selected';
                addLog('SYSTEM', 'Execution Finished', 'success');
            }
        }

        loadTests();
    </script>
</body>
</html>
